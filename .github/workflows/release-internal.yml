name: release-internal

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "README.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "IMPROVEMENTS.md"
      - ".gitignore"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload AAB to Google Play internal track (uncheck for dry-run build + preflight only)"
        type: boolean
        default: true
      skip_tests:
        description: "Skip testDebugUnitTest (lintRelease, preflight and bundleRelease still run)"
        type: boolean
        default: false
      promote_to_production:
        description: "After a successful internal upload, promote internal -> production in the same run (manual dispatch only)"
        type: boolean
        default: false
      release_status:
        description: "Production release status when promote_to_production is set (draft still needs 'Send for review' in Play Console)"
        type: choice
        options: [draft, inProgress, completed]
        default: draft
      user_fraction:
        description: "Staged rollout fraction (0 < f < 1), required when release_status=inProgress"
        required: false
        default: ""

permissions: {}

concurrency:
  group: play-publish-${{ vars.PACKAGE_NAME }}
  cancel-in-progress: false
  queue: max

jobs:
  publish-internal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute version
        run: |
          echo "VERSION_CODE=$((10000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="2.2.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Decode upload keystore to RAM
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_B64" ]; then
            echo "::error::UPLOAD_KEYSTORE_B64 secret is not configured"
            exit 1
          fi
          umask 077
          printf '%s' "$UPLOAD_KEYSTORE_B64" | base64 -d > /dev/shm/upload.keystore
          echo "ANDROID_KEYSTORE_PATH=/dev/shm/upload.keystore" >> "$GITHUB_ENV"

      - name: Test, lint, and build signed release AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          SKIP_TESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_tests }}
        run: |
          TASKS="testDebugUnitTest lintRelease bundleRelease"
          if [ "$SKIP_TESTS" = "true" ]; then
            TASKS="lintRelease bundleRelease"
            echo "::warning::skip_tests set: unit tests did NOT run for this release"
          fi
          ./gradlew $TASKS \
            -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"

      - name: Install gplay (pinned + checksum verified)
        env:
          GPLAY_VERSION: v1.0.2
        run: |
          curl -fsSLO "https://github.com/tamtom/play-console-cli/releases/download/${GPLAY_VERSION}/gplay-linux-amd64"
          curl -fsSLO "https://github.com/tamtom/play-console-cli/releases/download/${GPLAY_VERSION}/checksums.txt"
          grep 'gplay-linux-amd64$' checksums.txt | sha256sum -c -
          install -Dm 0755 gplay-linux-amd64 "$HOME/.local/bin/gplay"
          rm -f gplay-linux-amd64 checksums.txt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Offline Play preflight (zero credentials)
        # Keep --fail-on error because gplay v1.0.2 emits a false-positive warning on AGP's app-metadata.properties.
        run: |
          gplay preflight \
            --file app/build/outputs/bundle/release/app-release.aab \
            --max-size 100M \
            --fail-on error

      - name: Generate and validate clean en-US release notes
        run: |
          mkdir -p app/src/main/play/release-notes/en-US
          python3 - <<'PY' > app/src/main/play/release-notes/en-US/default.txt
          import re, subprocess
          try:
              prev = subprocess.check_output(
                  ["git", "describe", "--tags", "--abbrev=0", "HEAD^"],
                  stderr=subprocess.DEVNULL, text=True
              ).strip()
              log_args = ["git", "log", "--pretty=%s", f"{prev}..HEAD"]
          except subprocess.CalledProcessError:
              log_args = ["git", "log", "-n", "10", "--pretty=%s"]
          lines = subprocess.check_output(log_args, text=True).splitlines()
          skip_re = re.compile(r"^(wip|ci|chore|docs|build|merge\b)", re.I)
          prefix_re = re.compile(r"^[a-z]+(\([^)]+\))?!?:\s*", re.I)
          notes = []
          for raw in lines:
              s = raw.strip()
              if not s or skip_re.match(s):
                  continue
              s = prefix_re.sub("", s).strip()
              s = re.sub(r"\s*\(Wave \d+\)\s*$", "", s).strip()
              if not s:
                  continue
              s = s[0].upper() + s[1:]
              bullet = f"- {s}"
              if sum(len(x) + 1 for x in notes) + len(bullet) <= 490 and bullet not in notes:
                  notes.append(bullet)
          if not notes:
              notes = ["- Updated for Android 16 (API 36) and improved stability"]
          print("\n".join(notes))
          PY
          COUNT=$(wc -m < app/src/main/play/release-notes/en-US/default.txt)
          [ "$COUNT" -le 500 ] || { echo "::error::Release notes exceed 500 chars ($COUNT)"; exit 1; }

      - id: auth
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.PLAY_SA_EMAIL }}

      - name: Publish AAB + mapping to internal track
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
        run: |
          ./gradlew publishReleaseBundle \
            --track internal --release-status completed \
            -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-aab-${{ env.VERSION_CODE }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt

      - name: Remove keystore from RAM
        if: always()
        run: rm -f /dev/shm/upload.keystore

  # Optional fast path: promote the just-uploaded internal build to production in the same run.
  # Manual dispatch only. The production SA's WIF binding also requires event_name=workflow_dispatch from the allowed actor,
  # so a push to main can never reach production even if this condition were removed.
  promote-production:
    needs: publish-internal
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && inputs.promote_to_production }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/promote.yml
    with:
      from_track: internal
      to_track: production
      release_status: ${{ inputs.release_status }}
      user_fraction: ${{ inputs.user_fraction }}
      action: promote
