name: promote

on:
  workflow_dispatch:
    inputs:
      from_track:
        description: Source track
        type: choice
        options: [internal, alpha, beta]
        default: internal
      to_track:
        description: Target track
        type: choice
        options: [alpha, beta, production]
        default: production
      release_status:
        description: Release status for promote (use draft for first CI production release)
        type: choice
        options: [draft, inProgress, completed]
        default: draft
      user_fraction:
        description: Staged rollout fraction (0 < f < 1, required when status=inProgress or action=update-rollout)
        required: false
        default: ""
      action:
        description: Promotion or rollout action
        type: choice
        options: [promote, update-rollout, complete, halt]
        default: promote

permissions: {}

concurrency:
  group: ${{ inputs.to_track == 'production' && format('play-publish-prod-{0}', vars.PACKAGE_NAME) || format('play-publish-{0}', vars.PACKAGE_NAME) }}
  cancel-in-progress: false
  queue: max

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ inputs.to_track == 'production' && vars.PLAY_PROD_SA_EMAIL || vars.PLAY_SA_EMAIL }}

      - name: Run promotion
        env:
          FROM: ${{ inputs.from_track }}
          TO: ${{ inputs.to_track }}
          STATUS: ${{ inputs.release_status }}
          FRACTION: ${{ inputs.user_fraction }}
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            promote)
              if [ "$STATUS" = "inProgress" ]; then
                if [ -z "$FRACTION" ]; then
                  echo "::error::user_fraction is required when release_status=inProgress"
                  exit 1
                fi
                ./gradlew promoteArtifact --from-track "$FROM" --promote-track "$TO" \
                  --release-status inProgress --user-fraction "$FRACTION"
              else
                ./gradlew promoteArtifact --from-track "$FROM" --promote-track "$TO" \
                  --release-status "$STATUS"
              fi ;;
            update-rollout)
              if [ -z "$FRACTION" ]; then
                echo "::error::user_fraction is required for update-rollout"
                exit 1
              fi
              ./gradlew promoteArtifact --update "$TO" --user-fraction "$FRACTION" ;;
            complete)
              ./gradlew promoteArtifact --update "$TO" --release-status completed ;;
            halt)
              ./gradlew promoteArtifact --update "$TO" --release-status halted ;;
          esac
